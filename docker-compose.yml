services:
  postgres:
    image: postgres:16-alpine
    container_name: bit-solicitacoes-postgres
    environment:
      POSTGRES_DB: solicitacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solicitacoes"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bit-solicitacoes-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/solicitacoes
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: change-me-with-at-least-32-characters
      JWT_EXPIRATION_SECONDS: 3600
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      APP_TIME_ZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    environment:
      VITE_API_URL: http://localhost:8080/api
    container_name: bit-solicitacoes-frontend
    depends_on:
      - backend
    ports:
      - "5173:3000"

volumes:
  postgres_data:
